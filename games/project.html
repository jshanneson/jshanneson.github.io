<!DOCTYPE html>

  <meta name="theme-color" content="#0A1222">

  <!-- Marks JS as available before first paint so entrance animations can start hidden.
       If the scripts never start, the failsafe un-hides everything after 5s. -->
  <script>
    document.documentElement.classList.add('js');
    setTimeout(function () {
      if (!document.documentElement.getAttribute('data-anim')) document.documentElement.classList.add('no-anim');
    }, 5000);
  </script>
  <link rel="stylesheet" href="styles.css">
  <!-- Data first, then the renderer, then shared site behaviour. -->
  <script src="projects.js" defer></script>
  <script src="project.js" defer></script>
  <script src="script.js" defer></script>

  <!--
    PROJECT PAGE TEMPLATE
    One template, many projects. The page shows whichever project the URL asks for:
      project.html?p=ghostie-town
      project.html?p=acorn-island
    All content lives in projects.js. Nothing in this file needs editing per project.
  -->
</head>
